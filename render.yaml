services:
  - type: web
    name: icmr-search-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ICMR_PARALLEL
        value: "4"
      - key: ICMR_TIMEOUT
        value: "90"
      - key: ICMR_MAX_CACHED_DFS
        value: "2"
      - key: ICMR_HF_DATASET_URL
        value: "https://huggingface.co/datasets/rehuuuu/icrm-hitek-fulldb/resolve/main"
